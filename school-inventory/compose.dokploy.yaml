# Вариант для Dokploy (тип сервиса: Docker Compose, путь: ./compose.dokploy.yaml).
# Образ собирает GitHub Actions и кладёт в GHCR; сервер только скачивает его.
# IMAGE задаётся в Environment, например ghcr.io/ваш-логин/school-inventory:latest
# Порты наружу не публикуются: домен и HTTPS настраиваются в Dokploy → Domains
# (сервис app, порт 3000, сертификат Let's Encrypt). Переменные задаются во вкладке Environment.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=30']
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory -d inventory']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M
  app:
    image: ${IMAGE:?Set IMAGE, e.g. ghcr.io/owner/school-inventory:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://inventory:${DB_PASSWORD}@db:5432/inventory?connection_limit=5
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN, e.g. https://inventory.example.org}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET (32+ random chars)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SCHOOL_NAME: ${SCHOOL_NAME:-Моя школа}
      NODE_OPTIONS: --max-old-space-size=384
    expose:
      - '3000'
    volumes:
      - files:/app/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  postgres:
  files:
